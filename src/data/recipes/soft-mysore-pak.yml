id: soft-mysore-pak
slug: soft-mysore-pak
title: Soft Mysore Pak
subtitle: Soft ghee Mysore pak from Karnataka
description: Soft ghee Mysore pak from her notes — roasted besan cooked in one-string sugar syrup with hot ghee until a small ball is no longer sticky.
personalNote: From her Apple Notes.
image: soft-mysore-pak.jpg
imageAlt: Soft golden Mysore pak pieces with a porous texture
