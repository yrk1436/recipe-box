instructions:
  - "Her Apple Notes list had ingredients and a chili tip only. These steps follow the standard Andhra/Telugu jantikalu method and are written to match her ingredients — they are not from her note."
  - Dry-roast the minappapu (urad dal) and sabudana (sago / tapioca pearls) until aromatic. Cool, then grind both to a fine powder.
  - Mix the rice flour, besan, roasted minappapu–sabudana powder, vaamu (ajwain / carom seeds), nuvvulu (sesame seeds), salt, and soft butter.
  - Make the mirchi ginger paste — grind green chilies with ginger and water in a mixie (mixer grinder), then filter / strain the liquid into the pindi (flour / dough).
  - Knead a soft dough.
  - Heat oil for deep frying. Press the dough through a murukku / jantikalu press fitted with the star plate, directly into the hot oil.
  - Fry on medium heat until the bubbling stops and the jenthikulu are crisp.
  - Drain, cool, and store in an airtight container.
