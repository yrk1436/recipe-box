title: Chatpata Chicken
subtitle: Air-fried
description: "Chicken marinated with salt, karam (chili powder), pasupu (turmeric), any chicken masala (tandoori masala was used here), ginger garlic paste, lemon, corn flour, besan (chickpea flour), and oil, then air-fried. Preheat the air fryer to 425°F, then air fry for 20 minutes."
personalNote: From Swathi's kitchen notes. She air-fried this, and it tasted good.
