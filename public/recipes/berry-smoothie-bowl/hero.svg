<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4d4d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="smoothie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#db2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg2)"/>
  
  <!-- Decorative pattern -->
  <g fill="#fff" fill-opacity="0.1">
    <circle cx="80" cy="100" r="40"/>
    <circle cx="720" cy="150" r="30"/>
    <circle cx="650" cy="450" r="50"/>
    <circle cx="120" cy="500" r="25"/>
  </g>
  
  <!-- Bowl shadow -->
  <ellipse cx="400" cy="360" rx="180" ry="60" fill="#000" fill-opacity="0.2"/>
  
  <!-- Bowl outer -->
  <path d="M220 280 Q220 420 400 420 Q580 420 580 280 L580 260 Q580 240 560 240 L240 240 Q220 240 220 260 Z" fill="url(#bowl)"/>
  
  <!-- Smoothie base -->
  <ellipse cx="400" cy="280" rx="160" ry="50" fill="url(#smoothie)"/>
  
  <!-- Banana slices -->
  <g fill="#fef08a" stroke="#eab308" stroke-width="1">
    <ellipse cx="320" cy="270" rx="25" ry="15" transform="rotate(-20 320 270)"/>
    <ellipse cx="350" cy="260" rx="25" ry="15" transform="rotate(10 350 260)"/>
    <ellipse cx="380" cy="255" rx="25" ry="15"/>
  </g>
  
  <!-- Berries -->
  <g>
    <!-- Blueberries -->
    <circle cx="450" cy="265" r="12" fill="#3b82f6"/>
    <circle cx="470" cy="275" r="10" fill="#2563eb"/>
    <circle cx="430" cy="275" r="11" fill="#3b82f6"/>
    <!-- Raspberries -->
    <circle cx="490" cy="260" r="14" fill="#f43f5e"/>
    <circle cx="510" cy="275" r="12" fill="#e11d48"/>
    <!-- Strawberry -->
    <path d="M340 285 Q330 265 340 255 Q350 265 340 285" fill="#ef4444"/>
  </g>
  
  <!-- Granola line -->
  <g fill="#d97706">
    <circle cx="280" cy="280" r="6"/>
    <circle cx="295" cy="275" r="5"/>
    <circle cx="308" cy="282" r="6"/>
    <circle cx="520" cy="278" r="5"/>
    <circle cx="535" cy="272" r="6"/>
  </g>
  
  <!-- Chia seeds -->
  <g fill="#1f2937" fill-opacity="0.6">
    <circle cx="360" cy="290" r="2"/>
    <circle cx="370" cy="285" r="2"/>
    <circle cx="410" cy="288" r="2"/>
    <circle cx="425" cy="292" r="2"/>
    <circle cx="385" cy="295" r="2"/>
  </g>
  
  <!-- Honey drizzle -->
  <path d="M300 270 Q340 250 380 265 Q420 280 460 260" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Coconut flakes -->
  <g fill="#fff">
    <ellipse cx="400" cy="265" rx="10" ry="3" transform="rotate(30 400 265)"/>
    <ellipse cx="420" cy="258" rx="8" ry="2" transform="rotate(-20 420 258)"/>
    <ellipse cx="380" cy="260" rx="9" ry="2" transform="rotate(45 380 260)"/>
  </g>
  
  <!-- Text label -->
  <rect x="250" y="480" width="300" height="60" rx="10" fill="#fff" fill-opacity="0.95"/>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#7c3aed" text-anchor="middle">Berry Smoothie Bowl</text>
  
  <!-- Example badge -->
  <rect x="600" y="20" width="160" height="36" rx="18" fill="#dc2626"/>
  <text x="680" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">EXAMPLE RECIPE</text>
</svg>
